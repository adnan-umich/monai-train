model:
  type: "UNet"
  architecture:
    spatial_dims: 3
    in_channels: 1
    out_channels: 2
    channels: [64,128,256]
    strides: [2, 2]
    num_res_units: 2
    norm: "INSTANCE"
    dropout: 0.1
    kernel_size: 3
  optimizer: "Adam"
  beta_1: 0.999
  beta_2: 0.999
  weight_decay: 0.000001
  metric:
    type: "DiceLoss"
    loss_params:
      include_background: True
      to_onehot_y: True
      softmax: True
  validation_roi: [64,64,64]
  image_size: [128, 128, 128]
  slice_to_track: 40