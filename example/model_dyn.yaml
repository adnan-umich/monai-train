model:
  type: "DynUNet"
  architecture:
    spatial_dims: 3
    in_channels: 1
    out_channels: 2
    strides: [[1,1,1], [2,2,2], [2,2,2], [2,2,2], [2,2,2]]
    kernel_size: [[3,3,3], [3,3,3], [3,3,3], [3,3,3], [3,3,3]]
    upsample_kernel_size: [[2,2,2], [2,2,2], [2,2,2], [2,2,2]]
    dropout: 0.1
    filters: [32, 64, 128, 256, 320]
  optimizer: "Adam"
  beta_1: 0.900
  beta_2: 0.888
  weight_decay: 0.001
  metric:
    type: "DiceLossCrossEntropyLoss"
    include_background: False
    softmax: True
    reduction: "mean"
  validation_roi: [48,48,48]
  image_size: [128, 128, 128]
  slice_to_track: 40
